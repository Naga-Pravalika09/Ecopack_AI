<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPackAI - Sustainable Packaging Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .card-header {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px 20px;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            padding: 12px 30px;
            font-weight: bold;
        }
        .btn-pdf {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
        }
        .btn-pdf:hover, .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .recommendation-card {
            border-left: 4px solid #2ecc71;
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .recommendation-card:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .progress {
            height: 6px;
            border-radius: 3px;
        }
        .rank-badge {
            font-size: 1.2rem;
            font-weight: bold;
            display: inline-block;
            width: 30px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .stat-card {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2ecc71;
        }
        .export-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .chart-container {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-leaf"></i> EcoPackAI</h1>
            <p>AI-Powered Sustainable Packaging Recommendation System</p>
        </div>

        <!-- Input Form -->
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-box"></i> Product Specifications</h4>
            </div>
            <div class="card-body">
                <form id="recommendationForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="productName" placeholder="e.g., Food Container" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Industry</label>
                            <select class="form-select" id="industry">
                                <option value="">All Industries</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Cosmetics">Cosmetics</option>
                                <option value="Food">Food & Beverage</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Automotive">Automotive</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Packaging">Packaging</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Weight (kg)</label>
                            <input type="number" class="form-control" id="weight" step="0.1" value="1.0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Number of Recommendations</label>
                            <select class="form-select" id="topN">
                                <option value="5">Top 5</option>
                                <option value="10" selected>Top 10</option>
                                <option value="15">Top 15</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" id="prioritySustainability">
                                <label class="form-check-label">
                                    <i class="fas fa-leaf"></i> Priority: Maximize Sustainability
                                </label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search"></i> Find Sustainable Materials
                    </button>
                </form>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2">AI is analyzing materials...</p>
        </div>

        <!-- Results -->
        <div id="results" style="display: none;">
            <div class="export-bar">
                <button class="btn btn-pdf" id="exportPdfBtn">
                    <i class="fas fa-file-pdf"></i> Export as PDF
                </button>
            </div>

            <!-- Chart -->
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-chart-bar"></i> Environmental Score Breakdown</h4>
                </div>
                <div class="card-body chart-container">
                    <img id="comparisonChart" src="" alt="Comparison Chart" style="width: 100%;">
                </div>
            </div>

            <!-- Recommendations Table -->
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-star"></i> Top Material Recommendations</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="recommendationsTable">
                            <thead>
                                <tr style="background: #2ecc71; color: white;">
                                    <th>Rank</th>
                                    <th>Material</th>
                                    <th>Type</th>
                                    <th>Eco Score</th>
                                    <th>Biodegradability</th>
                                    <th>CO₂ Efficiency</th>
                                    <th>Recyclability</th>
                                    <th>Est. Cost</th>
                                </tr>
                            </thead>
                            <tbody id="recommendationsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="row" id="stats"></div>
        </div>
    </div>

    <script>
        let currentRecommendations = [];
        let currentProductData = {};

        // Handle form submission
        document.getElementById('recommendationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            currentProductData = {
                product_name: document.getElementById('productName').value,
                industry: document.getElementById('industry').value,
                weight_kg: parseFloat(document.getElementById('weight').value),
                top_n: parseInt(document.getElementById('topN').value),
                priority_sustainability: document.getElementById('prioritySustainability').checked
            };
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            
            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentProductData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentRecommendations = data.recommendations;
                    displayRecommendations(data.recommendations);
                    document.getElementById('comparisonChart').src = 'data:image/png;base64,' + data.chart;
                    document.getElementById('results').style.display = 'block';
                    loadAnalytics();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Failed to get recommendations');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
        
        function displayRecommendations(recommendations) {
            const tbody = document.getElementById('recommendationsBody');
            tbody.innerHTML = '';
            
            recommendations.forEach((rec, index) => {
                const row = tbody.insertRow();
                const rankCell = row.insertCell(0);
                const nameCell = row.insertCell(1);
                const typeCell = row.insertCell(2);
                const ecoCell = row.insertCell(3);
                const bioCell = row.insertCell(4);
                const co2Cell = row.insertCell(5);
                const recycleCell = row.insertCell(6);
                const costCell = row.insertCell(7);
                
                let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index+1}`;
                rankCell.innerHTML = `<span class="rank-badge">${medal}</span>`;
                nameCell.innerHTML = `<strong>${rec.material_name}</strong>`;
                typeCell.innerHTML = `<span class="badge bg-secondary">${rec.material_type}</span>`;
                ecoCell.innerHTML = `<span class="badge bg-success">${rec.eco_score}%</span>`;
                bioCell.innerHTML = `${rec.biodegradability}%`;
                co2Cell.innerHTML = `${rec.co2_efficiency}%`;
                recycleCell.innerHTML = `${rec.recyclability}%`;
                costCell.innerHTML = `$${rec.est_cost}`;
                
                // Add progress bars for better visualization
                bioCell.innerHTML += `<div class="progress mt-1"><div class="progress-bar bg-success" style="width: ${rec.biodegradability}%"></div></div>`;
                co2Cell.innerHTML += `<div class="progress mt-1"><div class="progress-bar bg-info" style="width: ${rec.co2_efficiency}%"></div></div>`;
                recycleCell.innerHTML += `<div class="progress mt-1"><div class="progress-bar bg-warning" style="width: ${rec.recyclability}%"></div></div>`;
            });
        }
        
        // PDF Export
        document.getElementById('exportPdfBtn').addEventListener('click', async function() {
            if (!currentRecommendations.length) {
                alert('No recommendations to export. Please search first.');
                return;
            }
            
            try {
                const response = await fetch('/api/export-pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product_name: currentProductData.product_name,
                        industry: currentProductData.industry,
                        weight_kg: currentProductData.weight_kg,
                        recommendations: currentRecommendations
                    })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `EcoPackAI_Report_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('Failed to generate PDF');
                }
            } catch (error) {
                alert('Error generating PDF');
            }
        });
        
        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics');
                const data = await response.json();
                
                if (data.success) {
                    const a = data.analytics;
                    document.getElementById('stats').innerHTML = `
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-value">${a.total_materials}</div>
                                <div>Materials in Database</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-value">${a.avg_biodegradability}%</div>
                                <div>Avg Biodegradability</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-value">${a.avg_recyclability}%</div>
                                <div>Avg Recyclability</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-value">${a.avg_co2_reduction}%</div>
                                <div>Avg CO₂ Reduction</div>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }
        
        // Load initial analytics
        loadAnalytics();
    </script>
</body>
</html>
